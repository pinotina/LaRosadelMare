<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }
        .fs-vid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -99;
        }
        .fs-vid-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="fs-vid-background">
        <video autoplay muted loop playsinline>
            <source src="https://pinotina.github.io/LaRosadelMare/Lory.mp4" type="video/mp4">
        </video>
    </div>
</body>
</html>
