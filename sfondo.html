<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sfondo Video</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }
        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="container">
        <video autoplay muted loop playsinline controls>
            <source src="https://litter.catbox.moe/zd0zf6v5eszmepbc.mp4" type="video/mp4">
            Il tuo browser non supporta il tag video.
        </video>
    </div>
</body>
</html>
