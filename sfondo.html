<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }
        .fs-vid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
            pointer-events: none;
        }
        .fs-vid-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="fs-vid-background">
        <video autoplay muted loop playsinline preload="auto">
            <source src="https://litter.catbox.moe/zd0zf6v5eszmepbc.mp4" type="video/mp4">
        </video>
    </div>
</body>
</html>
