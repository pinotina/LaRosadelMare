<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sfondo Xat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #bg-video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Mostra tutto il video senza tagliarlo */
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <video id="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
  </video>
  <script>
    const vid = document.getElementById('bg-video');
    vid.muted = true;
    vid.play().catch(e => console.log(e));
  </script>
</body>
</html>
